[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-lidar-camera-calibration-web"
version = "0.1.0"
description = "Local browser-based manual camera–LiDAR extrinsic calibration and overlay inspection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "emmeyteja"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-python-headless>=4.8,<5"]

[project.optional-dependencies]
bags = ["rosbags>=0.10,<0.12"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
manual-calibration = "manual_calibration.cli:main"

[project.urls]
Repository = "https://github.com/emmeyteja/manual-lidar-camera-calibration-web"

[tool.setuptools.package-data]
manual_calibration = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
